<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Meter Lapangan - PAM (Offline)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --bg-dark: #1e1e1e; --bg-card: #2e2e2e; --border-color: #2d2d2d; --text-main: #ffffff; --accent-cyan: #38bdf8; }
        
        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden; /* Mencegah seluruh halaman ikut scroll */
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* Container utama dibagi menjadi 3 bagian secara flexbox vertikal */
        .container {
            max-width: 600px !important;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px 10px !important;
            box-sizing: border-box;
        }

        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 0.6rem; 
            color: var(--text-main); 
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); 
        }

        .card-body {
            padding: 8px 12px !important;
        }

        .form-label { color: #cbd5e1 !important; margin-bottom: 0.2rem !important; }
        
        .form-control, .form-select { 
            background-color: #141414; 
            border: 1px solid var(--border-color); 
            color: #ffffff !important; 
            border-radius: 0.5rem; 
            padding: 0.3rem 0.6rem; 
            font-size: 0.85rem; 
        }
        
        .form-control:focus, .form-select:focus { 
            background-color: #141414; 
            border-color: var(--accent-cyan); 
            color: #ffffff; 
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25); 
        }

        .input-group-text { background-color: #333333; border: 1px solid var(--border-color); color: #989a9c; padding: 0.3rem 0.6rem; }
        
        .btn-primary { 
            background-color: #0284c7; 
            border-color: #0284c7; 
            font-weight: 600; 
            border-radius: 0.5rem; 
            padding: 0.4rem 1rem; 
            font-size: 0.9rem;
        }
        .btn-primary:hover { background-color: #0369a1; }

        #btnSinkron {
            padding: 0.4rem 1rem !important;
            font-size: 0.9rem;
        }

        .list-group-item { background-color: #1e1e1e; color: #ffffff; border-color: var(--border-color); }
        .list-group-item:hover { background-color: #141414; color: var(--accent-cyan); }

        form .mb-1 {
            margin-bottom: 0.35rem !important;
        }
        #cari_pelanggan::placeholder {
            color: #4a4a4a; /* Ganti dengan warna yang diinginkan */
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="container py-0">
    
    <!-- 1. BAGIAN ATAS (STATIS / DIAM) -->
    <div class="flex-shrink-0">
        <div class="text-center mb-1">
            <h4 class="fw-bold text-white fs-6 mb-1"><i class="bi bi-speedometer2 text-info me-0"></i> Pencatatan Meter Lapangan</h4>
            <div id="statusKoneksiBadge" class="badge bg-warning text-dark px-2 py-1 shadow-sm fs-9" style="font-size: 0.75rem;">
                <i class="bi bi-wifi-off me-0"></i> Status: Mode Mandiri / Offline HP (DB Aman)
            </div>
        </div>
        <div class="card mb-2 shadow-sm border-grey">
            <div class="card-body p-2"> 
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small text-uppercase fw-bold text-grey" style="font-size: 0.75rem;"><i class="bi bi-clipboard-check me-1"></i> Kontrol Sisa Bulan Ini</span>
                    <span class="badge bg-secondary" id="badge_tahun_bulan_aktif">Bulan Ini</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="text-secondary small" style="font-size: 0.75rem;">Belum dicatat periode ini:</span>
                    <span class="fw-bold text-warning" id="counter_belum_catat" style="font-size: 0.75rem;">- Orang</span>
                </div>
                <button type="button" class="btn btn-outline-warning btn-sm w-100 fw-bold py-1" data-bs-toggle="modal" data-bs-target="#modalSisaBelumDicatat" style="font-size: 0.75rem;">
                    <i class="bi bi-list-ul me-1"></i> Tampilkan Daftar Belum Dicatat
                </button>
            </div>
        </div>
    </div>

    <!-- 2. BAGIAN TENGAH (AREA YANG BISA SCROLL MANDIRI) -->
    <div class="flex-grow-1 overflow-y-auto px-1 mb-1" style="min-height: 0;">
        <div class="card shadow-sm mb-0">
            <div class="card-body p-3">
                <form id="formPencatatan">
                    <div class="mb-2 position-relative">
                        <label class="form-label small fw-bold text-normal">Cari Nama / No. Rekening Pelanggan <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="cari_pelanggan" placeholder="Ketik nama atau No. Rekening..." autocomplete="off" required>
                        </div>
                        <div id="hasilPencarian" class="list-group position-absolute w-100 shadow-lg" style="z-index: 1056; max-height: 180px; overflow-y: auto; margin-top: 2px;"></div>
                    </div>
                     
                    <!-- KOTAK INFO PELANGGAN -->
                    <!-- KOTAK INFO PELANGGAN -->
<div class="mb-2 rounded border border-secondary shadow-sm px-2 py-1.5" id="box_info_pelanggan" style="display: none; text-align: left; background-color: var(--bg-dark) !important;">
                        <div class="small fw-bold mb-0.5" style="font-size: 0.7rem; color: #ffffff !important;">Pelanggan Dipilih:</div>
                        <div>
                            <span id="txt_info_rekening" class="text-info fw-bold"></span> - <span id="txt_info_nama" class="text-white"></span>
                            <div class="small mt-0.5" style="color: #facc15 !important; font-size: 0.75rem;">
                                <i class="bi bi-geo-alt me-1"></i><span id="txt_info_alamat"></span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-1">
                        <label class="form-label small fw-bold text-normal">Tahun <span class="text-danger">*</span></label>
                        <select class="form-select" id="pilih_tahun" required>
                            <option value="2026" selected>2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                        </select>
                    </div>
                    <div class="mb-1">
                        <label class="form-label small fw-bold text-normal">Bulan <span class="text-danger">*</span></label>
                        <select class="form-select" id="pilih_bulan" required>
                            <option value="">-- Pilih Bulan --</option>
                            <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                            <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                            <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
                            <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
                        </select>
                    </div>
                    <div class="row g-2">
                        <div class="col-6 mb-1">
                            <label class="form-label small fw-bold text-normal">Meter Awal <span class="text-danger">*</span></label>
                            <input type="number" step="any" class="form-control" id="meter_awal" required placeholder="0">
                            <small class="text-info" id="info_auto_awal" style="font-size: 0.65rem; display: none;"><i class="bi bi-info-circle"></i> Otomatis dari bulan lalu</small>
                        </div>
                        <div class="col-6 mb-1">
                            <label class="form-label small fw-bold text-normal">Meter Akhir <span class="text-danger">*</span></label>
                            <input type="number" step="any" class="form-control" id="meter_akhir" required placeholder="0">
                        </div>
                    </div>
                    <input type="hidden" id="id_rekening_val">
                </form>
            </div>
        </div>
    </div>
    
    <!-- 3. BAGIAN BAWAH (STATIS / DIAM - BERISI TOMBOL SIMPAN & TOMBOL SINKRON) -->
    <div class="flex-shrink-0 pt-1 pb-1">
        <div class="d-grid gap-2">
            <!-- Tombol Simpan di luar form menggunakan atribut form="formPencatatan" -->
            <button type="submit" form="formPencatatan" class="btn btn-primary py-2 fw-bold shadow-sm" id="btnSimpanOffline">
                <i class="bi bi-cloud-arrow-up-fill me-1"></i> Simpan ke Memori HP (Offline)
            </button>
    <div class="flex-shrink-0 pt-1 pb-1">
        <button type="button" class="btn btn-success w-100 py-2 fw-bold shadow-sm" id="btnSinkron">
            <i class="bi bi-arrow-repeat me-1"></i> Sinkronkan Data ke Server (<span id="jumlahPending">0</span> Pending)
        </button>
    </div>

</div>

<div class="modal fade" id="modalSisaBelumDicatat" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow-lg bg-dark text-white border border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title fw-bold text-info"><i class="bi bi-person-exclamation me-2"></i> Belum Dicatat (<span id="modal_lbl_periode">-</span>)</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <div class="input-group mb-3">
            <span class="input-group-text bg-secondary border-0 text-white"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control bg-secondary text-white border-0" id="cari_dalam_sisa" placeholder="Cari nama dalam daftar sisa...">
        </div>
        <div id="listContainerSisa" class="list-group">
            <div class="text-center text-muted py-4 small">Memuat data...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="pelanggan.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => { console.log('Service Worker terdaftar'); })
              .catch(err => { console.log('Service Worker gagal'); });
        });
    }

    // ==================== SISTEM INDEXEDDB (ANTI DROP / RESTART) ====================
    const DB_NAME = "PAM_PencatatanDB";
    const STORE_NAME = "pending_sync_store";
    let dbInstance = null;

    function openDatabase() {
        return new Promise((resolve, reject) => {
            if (dbInstance) return resolve(dbInstance);
            let request = indexedDB.open(DB_NAME, 1);
            request.onerror = event => reject("Error opening IndexedDB");
            request.onsuccess = event => {
                dbInstance = event.target.result;
                resolve(dbInstance);
            };
            request.onupgradeneeded = event => {
                let db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: "id_unik" });
                }
            };
        });
    }

    async function getPendingFromIDB() {
        try {
            let db = await openDatabase();
            return new Promise((resolve) => {
                let transaction = db.transaction(STORE_NAME, "readonly");
                let store = transaction.objectStore(STORE_NAME);
                let request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => {
                    let fallback = JSON.parse(localStorage.getItem("pending_sync") || "[]");
                    resolve(fallback);
                };
            });
        } catch (e) {
            return JSON.parse(localStorage.getItem("pending_sync") || "[]");
        }
    }

    async function savePendingToIDB(dataArray) {
        localStorage.setItem("pending_sync", JSON.stringify(dataArray));
        try {
            let db = await openDatabase();
            return new Promise((resolve, reject) => {
                let transaction = db.transaction(STORE_NAME, "readwrite");
                let store = transaction.objectStore(STORE_NAME);
                store.clear();
                dataArray.forEach(item => {
                    item.id_unik = `${item.id_rekening}_${item.tahun}_${item.bulan}`;
                    store.put(item);
                });
                transaction.oncomplete = () => resolve(true);
                transaction.onerror = () => reject(false);
            });
        } catch (e) {
            console.error("Gagal simpan ke IndexedDB:", e);
        }
    }

    async function clearPendingIDB() {
        localStorage.removeItem("pending_sync");
        try {
            let db = await openDatabase();
            return new Promise((resolve) => {
                let transaction = db.transaction(STORE_NAME, "readwrite");
                let store = transaction.objectStore(STORE_NAME);
                store.clear();
                transaction.oncomplete = () => resolve(true);
            });
        } catch (e) {}
    }

    async function loadDataMaster() {
        let pending = await getPendingFromIDB();
        pending.forEach(item => {
            if (!riwayatTagihanGlobal[item.id_rekening]) riwayatTagihanGlobal[item.id_rekening] = {};
            if (!riwayatTagihanGlobal[item.id_rekening][item.tahun]) riwayatTagihanGlobal[item.id_rekening][item.tahun] = {};
            riwayatTagihanGlobal[item.id_rekening][item.tahun][item.bulan] = parseFloat(item.meter_akhir);
        });
        
        updateCounterPending();
        let selectBulan = document.getElementById("pilih_bulan");
        if (!selectBulan.value) {
            let d = new Date();
            selectBulan.value = d.getMonth() + 1;
        }
        hitungSisaBelumDicatat();
    }

    document.addEventListener("DOMContentLoaded", async function() {
        await loadDataMaster();
        const inputCari = document.getElementById("cari_pelanggan");
        const containerHasil = document.getElementById("hasilPencarian");
        const selectBulan = document.getElementById("pilih_bulan");
        const selectTahun = document.getElementById("pilih_tahun");

        inputCari.addEventListener("input", function() {
            let keyword = this.value.toLowerCase().trim();
            containerHasil.innerHTML = "";
            if (keyword.length > 0) {
                let filtered = semuaPelanggan.filter(p => p.nama.toLowerCase().includes(keyword) || p.id_rekening.toLowerCase().includes(keyword));
                if (filtered.length > 0) {
                    filtered.slice(0, 8).forEach(item => {
                        let btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "list-group-item list-group-item-action py-2";
                        btn.innerHTML = `<strong>${item.id_rekening}</strong> - ${item.nama}<br><small style="color: #facc15;">${item.alamat || ""}</small>`;
                        btn.onclick = function() {
                            document.getElementById("id_rekening_val").value = item.id_rekening;
                            inputCari.value = item.nama + " (" + item.id_rekening + ")";
                            document.getElementById("txt_info_rekening").innerText = item.id_rekening;
                            document.getElementById("txt_info_nama").innerText = item.nama;
                            document.getElementById("txt_info_alamat").innerText = item.alamat || "-";
                            document.getElementById("box_info_pelanggan").style.display = "block";
                            containerHasil.innerHTML = "";
                            cekAutoMeterAwal();
                        };
                        containerHasil.appendChild(btn);
                    });
                } else {
                    containerHasil.innerHTML = "<div class=\"list-group-item text-danger small py-2\">Pelanggan tidak ditemukan</div>";
                }
            }
        });

        function cekAutoMeterAwal() {
            let idRek = document.getElementById("id_rekening_val").value;
            let bVal = parseInt(selectBulan.value);
            let tVal = parseInt(selectTahun.value);
            if (!idRek || !bVal || !tVal) return;
            let bLalu = bVal - 1;
            let tLalu = tVal;
            if (bLalu < 1) { bLalu = 12; tLalu -= 1; }
            if (riwayatTagihanGlobal[idRek] && riwayatTagihanGlobal[idRek][tLalu] && riwayatTagihanGlobal[idRek][tLalu][bLalu] !== undefined) {
                document.getElementById("meter_awal").value = riwayatTagihanGlobal[idRek][tLalu][bLalu];
                document.getElementById("info_auto_awal").style.display = "block";
            } else {
                document.getElementById("meter_awal").value = "";
                document.getElementById("info_auto_awal").style.display = "none";
            }
        }

        selectBulan.addEventListener("change", () => { cekAutoMeterAwal(); hitungSisaBelumDicatat(); });
        selectTahun.addEventListener("change", () => { cekAutoMeterAwal(); hitungSisaBelumDicatat(); });

        document.getElementById("formPencatatan").addEventListener("submit", async function(e) {
            e.preventDefault();
            let dataBaru = {
                id_rekening: document.getElementById("id_rekening_val").value,
                tahun: selectTahun.value,
                bulan: selectBulan.value,
                meter_awal: document.getElementById("meter_awal").value,
                meter_akhir: document.getElementById("meter_akhir").value,
                status: "BELUM BAYAR",
                waktu: new Date().getTime()
            };
            if(!dataBaru.id_rekening) { alert("Pilih pelanggan terlebih dahulu!"); return; }
            
            let pending = await getPendingFromIDB();
            pending = pending.filter(x => !(x.id_rekening === dataBaru.id_rekening && x.tahun === dataBaru.tahun && x.bulan === dataBaru.bulan));
            pending.push(dataBaru);
            
            await savePendingToIDB(pending);

            if (!riwayatTagihanGlobal[dataBaru.id_rekening]) riwayatTagihanGlobal[dataBaru.id_rekening] = {};
            if (!riwayatTagihanGlobal[dataBaru.id_rekening][dataBaru.tahun]) riwayatTagihanGlobal[dataBaru.id_rekening][dataBaru.tahun] = {};
            riwayatTagihanGlobal[dataBaru.id_rekening][dataBaru.tahun][dataBaru.bulan] = parseFloat(dataBaru.meter_akhir);
            
            alert("Berhasil disimpan ke memori HP & Database Aman!");
            this.reset();
            document.getElementById("box_info_pelanggan").style.display = "none";
            document.getElementById("info_auto_awal").style.display = "none";
            await updateCounterPending();
            hitungSisaBelumDicatat();
        });

        document.getElementById("btnSinkron").addEventListener("click", async function() {
            let pending = await getPendingFromIDB();
            
            if (pending.length === 0) {
                alert("Tidak ada data pending yang perlu disinkronkan.");
                return;
            }
            
            this.disabled = true;
            this.innerHTML = "<span class=\"spinner-border spinner-border-sm me-1\"></span> Menyinkronkan ke Cloud...";
            
            try {
                const SUPABASE_URL = "https://ilcezwxkwiwlsntgkoop.supabase.co"; 
                const SUPABASE_KEY = "sb_publishable_KvnuNJkijqdR_0bX5TKBzw_yhUkRPKE"; 

                let dataBersih = pending.map(item => ({
                    id_rekening: item.id_rekening,
                    tahun: item.tahun,
                    bulan: item.bulan,
                    meter_akhir: item.meter_akhir
                }));

                let response = await fetch(`${SUPABASE_URL}/rest/v1/antrean_tagihan_lapangan`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify(dataBersih)
                });

                if (response.ok || response.status === 201) {
                    await clearPendingIDB();
                    alert("Sinkronisasi Berhasil! Data sudah masuk aman ke Cloud.");
                    location.reload();
                } else {
                    let errText = await response.text();
                    alert("Gagal sinkronisasi dari Cloud: " + errText);
                }
            } catch (e) {
                alert("Gagal terhubung ke Cloud. Pastikan HP terhubung ke internet/paket data.");
            }
            
            this.disabled = false;
            this.innerHTML = "<i class=\"bi bi-arrow-repeat me-1\"></i> Sinkronkan Data ke Server (<span id=\"jumlahPending\">0</span> Pending)";
            await updateCounterPending();
        });
    });

    async function updateCounterPending() {
        let pending = await getPendingFromIDB();
        let el = document.getElementById("jumlahPending");
        if(el) el.innerText = pending.length;
    }

    const namaBulanTeks = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

    async function hitungSisaBelumDicatat() {
        let bPilih = document.getElementById("pilih_bulan").value;
        let tPilih = document.getElementById("pilih_tahun").value;
        if(!bPilih) return;
        let namaBln = namaBulanTeks[bPilih] || "";
        document.getElementById("badge_tahun_bulan_aktif").innerText = namaBln + " " + tPilih;
        document.getElementById("modal_lbl_periode").innerText = namaBln + " " + tPilih;
        let pending = await getPendingFromIDB();
        let belumList = [];
        if (typeof semuaPelanggan !== 'undefined') {
            semuaPelanggan.forEach(p => {
                let id = p.id_rekening;
                let adaServer = (riwayatTagihanGlobal[id] && riwayatTagihanGlobal[id][tPilih] && riwayatTagihanGlobal[id][tPilih][bPilih] !== undefined);
                let adaPending = pending.some(x => x.id_rekening === id && x.tahun === tPilih && String(x.bulan) === String(bPilih));
                if (!adaServer && !adaPending) { belumList.push(p); }
            });
        }
        let counterEl = document.getElementById("counter_belum_catat");
        if(counterEl) counterEl.innerText = belumList.length + " Orang";
        renderListSisaModal(belumList);
    }

    function renderListSisaModal(dataArray) {
        let container = document.getElementById("listContainerSisa");
        if(!container) return;
        container.innerHTML = "";
        if (dataArray.length === 0) {
            container.innerHTML = "<div class=\"text-center text-success py-4 small fw-bold\"><i class=\"bi bi-check-circle-fill fs-4 d-block mb-1\"></i> Luar biasa! Seluruh pelanggan sudah dicatat.</div>";
            return;
        }
        dataArray.forEach(item => {
            let div = document.createElement("div");
            div.className = "list-group-item d-flex justify-content-between align-items-center py-2.5";
            let infoDiv = document.createElement("div");
            infoDiv.innerHTML = "<strong>" + item.id_rekening + "</strong> - <span class=\"text-white\">" + item.nama + "</span><div class=\"small\" style=\"color: #facc15;\">" + (item.alamat || "-") + "</div>";
            let btnCatat = document.createElement("button");
            btnCatat.type = "button";
            btnCatat.className = "btn btn-sm btn-outline-info px-3 py-1 fw-semibold";
            btnCatat.innerText = "Catat";
            btnCatat.onclick = function() {
                pilihDariSisa(item.id_rekening, item.nama, item.alamat);
            };
            div.appendChild(infoDiv);
            div.appendChild(btnCatat);
            container.appendChild(div);
        });
    }

    function pilihDariSisa(idRek, namaPelanggan, alamatPelanggan) {
        document.getElementById("id_rekening_val").value = idRek;
        document.getElementById("cari_pelanggan").value = namaPelanggan + " (" + idRek + ")";
        document.getElementById("txt_info_rekening").innerText = idRek;
        document.getElementById("txt_info_nama").innerText = namaPelanggan;
        document.getElementById("txt_info_alamat").innerText = alamatPelanggan || "-";
        document.getElementById("box_info_pelanggan").style.display = "block";
        let modalEl = document.getElementById("modalSisaBelumDicatat");
        let modalObj = bootstrap.Modal.getInstance(modalEl);
        if(modalObj) modalObj.hide();
    }
</script>
</body>
